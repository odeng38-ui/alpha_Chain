name: alphachain

services:
  postgres:
    image: postgres:15-alpine
    container_name: alphachain_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alphachain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alphachain_secret}
      POSTGRES_DB: ${POSTGRES_DB:-alphachain_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alphachain -d alphachain_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: alphachain_redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: alphachain_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-alphachain}:${POSTGRES_PASSWORD:-alphachain_secret}@postgres:5432/${POSTGRES_DB:-alphachain_db}
      - REDIS_URL=redis://redis:6379/0
      - DART_API_KEY=${DART_API_KEY}
      - FRED_API_KEY=${FRED_API_KEY}
      - KRX_ID=${KRX_ID}
      - KRX_PW=${KRX_PW}
      - SECRET_KEY=${SECRET_KEY:-dev_secret}
      - APP_ENV=${APP_ENV:-development}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: alphachain_frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - BACKEND_URL=http://backend:8000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
